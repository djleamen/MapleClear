name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # extension/ is an npm workspace of the root package, so the lockfile
      # lives at the repo root and the install has to run from there.
      - run: npm ci
      - run: npm run lint:extension
      - run: npm run build:extension

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The full requirements pull torch/vllm; the API layer under test only
      # needs the web stack, so install just that to keep CI fast. ruff is
      # pinned to the version server/requirements.txt declares so CI and a
      # local `pip install -r server/requirements.txt` agree.
      - run: pip install "fastapi>=0.115" "pydantic>=2.9" "uvicorn[standard]" textstat aiosqlite httpx pytest "ruff==0.1.6"
      - run: ruff check server
      - run: pytest server/tests -q
